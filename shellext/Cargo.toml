[package]
name = "packnine_shellext"
version = "0.11.0"
edition = "2021"
description = "PackNine Windows 11 탐색기 컨텍스트 메뉴 핸들러 (IExplorerCommand)"
license = "MIT"

[lib]
name = "packnine_shellext"
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.58"
# implement: #[implement] 매크로가 *_Impl 트레이트를 생성하도록 하는 기능 플래그.
features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
]

[dependencies]
windows-core = "0.58"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
